dataset:
  name: uci-bike-sharing
  member: hour.csv
  # sha256 du fichier extrait (pas du zip) : reste valable quel que soit le miroir
  member_sha256: e03de4ee4ef4dc376ac6e04bf829673c6269e8eba5c60fa121640fa2f829504f
  # essayées dans l'ordre
  urls:
    - https://archive.ics.uci.edu/static/public/275/bike+sharing+dataset.zip
    - https://archive.ics.uci.edu/ml/machine-learning-databases/00275/Bike-Sharing-Dataset.zip
  timeout_seconds: 30

replay:
  # nombre de mois livrés d'un coup au premier lancement
  bootstrap_batches: 6

validation:
  # part minimale des heures du mois présentes dans le lot (le pire mois réel est à 92,5 %)
  min_hour_coverage: 0.90
  max_missing_days: 1
  max_rentals: 5000
  mean_rentals_min: 5
  mean_rentals_max: 1500
  # une température qui ne varie pas sur un mois = capteur figé
  min_temperature_std: 0.02

training:
  seed: 42
  # entraînement sur les 12 derniers mois acceptés
  window_months: 12
  # les 7 derniers jours de la fenêtre servent de jeu de test
  test_days: 7
  model:
    max_iter: 300
    learning_rate: 0.08
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
