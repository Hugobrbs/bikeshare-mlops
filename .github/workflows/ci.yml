name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Installer les dépendances verrouillées
        run: uv sync --locked --all-extras --all-groups
      - name: Erreurs statiques
        run: uv run --no-sync ruff check --output-format=github .
      - name: Formatage
        run: uv run --no-sync ruff format --check .

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Installer les dépendances verrouillées
        run: uv sync --locked --all-extras --all-groups
      - name: Tests et couverture
        run: >-
          uv run --no-sync pytest -m "not integration"
          --cov --cov-report=term --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.xml

  integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bikeshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:test@localhost:5432/bikeshare_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Installer les dépendances verrouillées
        run: uv sync --locked --all-extras --all-groups
      - name: PostgreSQL réel et moteur Prefect
        run: uv run --no-sync pytest -m integration

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Installer les dépendances verrouillées
        run: uv sync --locked --all-extras --all-groups
      - name: Vulnérabilités connues
        run: make audit

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Fichier compose valide
        run: docker compose config --quiet
      - name: Image de l'API
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Image du pipeline
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pipeline
          push: false
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,scope=pipeline,mode=max
