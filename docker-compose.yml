name: bikeshare

x-api-image: &api-image
  image: bikeshare-api:local
  build:
    context: .
    target: api
    args:
      APP_REVISION: ${APP_REVISION:-dev}

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  MLFLOW_TRACKING_URI: http://mlflow:7281
  MODEL_NAME: ${MODEL_NAME:-bikeshare-demand}
  MODEL_ALIAS: ${MODEL_ALIAS:-champion}
  MLFLOW_DISABLE_AGENT_HINT: "1"
  MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
  MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT: "true"
  GIT_PYTHON_REFRESH: quiet
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
  MLFLOW_HTTP_REQUEST_TIMEOUT: "20"

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bikeshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bikeshare-local-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/create-prefect-db.sql:/docker-entrypoint-initdb.d/create-prefect-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bikeshare"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    <<: *api-image
    command: ["bikeshare", "db", "init"]
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-bikeshare-local-postgres}@postgres:5432/bikeshare
      API_DB_PASSWORD: ${API_DB_PASSWORD:-bikeshare-local-api}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:-bikeshare-local-pipeline}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-bikeshare-local-grafana}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    restart: unless-stopped
    entrypoint: ["mlflow"]
    command:
      - server
      - --host=0.0.0.0
      - --port=7281
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:7281
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-7281}:7281"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7281/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  prefect:
    image: prefecthq/prefect:3.8.8-python3.12
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-bikeshare-local-postgres}@postgres:5432/prefect
      PREFECT_SERVER_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  alert-sink:
    <<: *api-image
    restart: unless-stopped
    command: ["bikeshare", "alerts", "serve"]
    environment:
      <<: *common-env
      API_HOST: 0.0.0.0
      OPS_DATABASE_URL: postgresql://pipeline_writer:${OPS_DB_PASSWORD:-bikeshare-local-pipeline}@postgres:5432/bikeshare
      ALERT_FORWARD_URL: ${ALERT_FORWARD_URL:-}
    ports:
      - "127.0.0.1:${ALERT_SINK_PORT:-8002}:8002"
    depends_on:
      db-init:
        condition: service_completed_successfully

  pipeline:
    image: bikeshare-pipeline:local
    build:
      context: .
      target: pipeline
      args:
        APP_REVISION: ${APP_REVISION:-dev}
    restart: unless-stopped
    environment:
      <<: *common-env
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_UI_URL: http://localhost:${PREFECT_PORT:-4200}
      PREFECT_LOGGING_EXTRA_LOGGERS: bikeshare
      PREFECT_LOGGING_TO_API_WHEN_MISSING_FLOW: ignore
      OPS_DATABASE_URL: postgresql://pipeline_writer:${OPS_DB_PASSWORD:-bikeshare-local-pipeline}@postgres:5432/bikeshare
      PIPELINE_SCHEDULE_SECONDS: ${PIPELINE_SCHEDULE_SECONDS:-600}
      ALERT_SINK_URL: http://alert-sink:8002/alerts
    volumes:
      - pipeline_data:/app/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      prefect:
        condition: service_healthy
      alert-sink:
        condition: service_started

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *common-env
      API_HOST: 0.0.0.0
      API_WORKERS: ${API_WORKERS:-1}
      OMP_NUM_THREADS: ${API_OMP_THREADS:-1}
      API_DATABASE_URL: postgresql://api_writer:${API_DB_PASSWORD:-bikeshare-local-api}@postgres:5432/bikeshare
      API_DB_POOL_MAX: ${API_DB_POOL_MAX:-5}
      MODEL_REFRESH_SECONDS: ${MODEL_REFRESH_SECONDS:-30}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-15}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-bikeshare-local-admin-token}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    deploy:
      resources:
        limits:
          cpus: ${API_CPUS:-1.0}
          memory: ${API_MEMORY:-768M}
    depends_on:
      db-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-bikeshare-local-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-bikeshare-local-grafana}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  mlflow_data:
  pipeline_data:
  grafana_data:
