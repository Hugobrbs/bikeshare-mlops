[project]
name = "bikeshare-mlops"
version = "0.1.0"
description = "Chaîne MLOps de prévision horaire de la demande de vélos en libre-service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Hugo Barbosa" }]

dependencies = [
  # versions figées : un modèle sklearn ne se recharge bien qu'à version identique
  "pandas==2.2.3",
  "numpy==2.2.6",
  "scikit-learn==1.6.1",
  "mlflow==3.17.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "typer>=0.15",
  "psutil>=6.0",
]

[project.optional-dependencies]
# uniquement pour le pipeline d'entraînement, pas installé dans l'image de l'API
pipeline = [
  "prefect==3.8.7",
  "great-expectations==1.23.2",
  "matplotlib==3.10.3",
]

[project.scripts]
bikeshare = "bikeshare.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "pip-audit>=2.7",
]
loadtest = [
  "locust==2.46.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeshare"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "loadtests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "N", "RUF"]
# RUF001-003 : faux positifs sur les accents et apostrophes du français
# N803, N806 : X en majuscule, comme dans scikit-learn
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["bikeshare"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Option", "typer.Argument",
  "fastapi.Depends", "fastapi.Header", "fastapi.Body", "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: a besoin d'un vrai service (PostgreSQL, Prefect)"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["bikeshare"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
